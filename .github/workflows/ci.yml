name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 8 * * 1'  # Every Monday at 08:00 UTC

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests - PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}${{ matrix.os && format(' / {0}', matrix.os) || '' }}${{ matrix.experimental && ' (experimental)' || '' }}
    # Pinned, not ubuntu-latest: the ZIP tools under test come from the image, so
    # the image may only change on purpose.
    runs-on: ${{ matrix.os || 'ubuntu-24.04' }}
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The nesbot/carbon 3.12.0 guard (Laravel 12.62+'s Carbon::plus() override is
          # fatal with that one release; carbon 3.12.1 dropped the conflicting method)
          # lives in composer.json's "conflict" section, so every row - and every
          # client install - resolves a compatible carbon.
          # The L12 rows resolve Pest 4 / PHPUnit 12 (Pest 5 needs Laravel 13 and
          # Symfony 8), hence the "^4 || ^5" Pest constraints in composer.json.
          - php: '8.4'
            laravel: '12.*'
            testbench: '^10.0'
            coverage: true
          - php: '8.4'
            laravel: '13.*'
            testbench: '^11.0'
          - php: '8.5'
            laravel: '13.*'
            testbench: '^11.0'
          - php: '8.5'
            laravel: '12.*'
            testbench: '^10.0'
          # The newest Laravel and Testbench that composer.json allows, on the newest
          # image. When Dependabot widens the constraints for a new Laravel major,
          # this row tests it without a matrix change.
          - php: '8.5'
            laravel: 'latest'
            testbench: '*'
            os: ubuntu-26.04
          # Allowed by "php": "^8.4", so sites can run it. Doesn't block a merge
          # until it is a stable release on setup-php.
          - php: '8.6'
            laravel: '13.*'
            testbench: '^11.0'
            experimental: true
          # The oldest ZIP tools still in use: p7zip 16.02 and a libzip before 1.9.
          - php: '8.4'
            laravel: '13.*'
            testbench: '^11.0'
            os: ubuntu-22.04
            old-libzip: true

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, fileinfo
          coverage: ${{ matrix.coverage && 'xdebug' || 'none' }}

      # The 7z tests skip themselves when 7z is missing, so a missing 7z must fail here.
      - name: Check the ZIP tools under test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y p7zip-full
          command -v 7z
          7z | head -n 3
          php -r 'echo "libzip ", ZipArchive::LIBZIP_VERSION, PHP_EOL;'
          ${{ matrix.old-libzip && 'php -r ''exit(version_compare(ZipArchive::LIBZIP_VERSION, "1.9.0", "<") ? 0 : 1);''' || 'true' }}

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ matrix.laravel }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-${{ matrix.laravel }}-

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel == 'latest' && '*' || matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction

      - name: Run tests
        timeout-minutes: 10
        run: vendor/bin/pest --log-junit=build/report.junit.xml ${{ matrix.coverage && '--coverage-text --coverage-clover=coverage.xml' || '--no-coverage' }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-php${{ matrix.php }}-laravel${{ matrix.laravel == '12.*' && '12' || matrix.laravel == '13.*' && '13' || matrix.laravel }}-${{ matrix.os || 'ubuntu-24.04' }}
          path: build/report.junit.xml
          retention-days: 7

      - name: Upload coverage to Codecov
        if: matrix.coverage
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false

  static-analysis:
    name: PHPStan
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, fileinfo
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-phpstan-${{ hashFiles('composer.lock') }}
          restore-keys: composer-phpstan-

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Cache PHPStan results
        uses: actions/cache@v6
        with:
          path: /tmp/phpstan
          key: phpstan-${{ hashFiles('src/**/*.php') }}
          restore-keys: phpstan-

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=512M

  code-style:
    name: Code Style
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-pint-${{ hashFiles('composer.lock') }}
          restore-keys: composer-pint-

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Check code style
        run: vendor/bin/pint --test

  weekly-report:
    name: Weekly run report
    # GitHub turns a schedule off after 60 days without repository activity, and the
    # weekly run failed unnoticed for weeks before that happened.
    if: always() && github.event_name == 'schedule'
    needs: [tests, static-analysis, code-style]
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Keep the weekly schedule turned on
        run: gh workflow enable ci.yml

      - name: Open or update an issue when the weekly run failed
        if: contains(needs.*.result, 'failure')
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Weekly CI run failed'
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$title" --body "The scheduled CI run failed: $RUN_URL"
          fi
