version: 2

updates:
  # Dependabot can't widen the illuminate/* and testbench ranges together, so a new
  # major (Laravel 14, Guzzle 9, ...) is added by hand in one PR. CI's "latest" row
  # then tests it.
  - package-ecosystem: 'composer'
    directory: '/'
    versioning-strategy: widen
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore'
      include: scope
    labels:
      - 'dependencies'
      - 'php'
    reviewers:
      - devuni-cz
    groups:
      laravel:
          patterns:
              - 'laravel/*'
              - 'illuminate/*'
              - 'orchestra/*'
      pestphp:
          patterns:
              - 'pestphp/*'
      phpunit:
          patterns:
              - 'phpunit/*'
      phpstan:
          patterns:
              - 'phpstan/*'
              - 'larastan/*'
      symfony:
          patterns:
              - 'symfony/*'
      guzzle:
          patterns:
              - 'guzzlehttp/*'
      minor-and-patch:
          update-types:
              - 'minor'
              - 'patch'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: 'ci'
      include: scope
    groups:
      actions:
          patterns:
              - 'actions/*'
      setup:
          patterns:
              - 'shivammathur/setup-php'
      codecov:
          patterns:
              - 'codecov/*'
      release:
          patterns:
              - 'softprops/action-gh-release'
              - 'stefanzweifel/git-auto-commit-action'
