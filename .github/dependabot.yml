version: 2

updates:
  # A library: a new major (Laravel 14, Guzzle 9, ...) is added next to the current
  # range ("^13.14 || ^14.0") in one PR, and CI's "latest" row tests it.
  - package-ecosystem: 'composer'
    directory: '/'
    versioning-strategy: widen
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore'
      include: scope
    labels:
      - 'dependencies'
      - 'php'
    reviewers:
      - devuni-cz
    groups:
      laravel:
          patterns:
              - 'laravel/*'
              - 'illuminate/*'
              - 'orchestra/*'
      pestphp:
          patterns:
              - 'pestphp/*'
      phpunit:
          patterns:
              - 'phpunit/*'
      phpstan:
          patterns:
              - 'phpstan/*'
              - 'larastan/*'
      symfony:
          patterns:
              - 'symfony/*'
      guzzle:
          patterns:
              - 'guzzlehttp/*'
      minor-and-patch:
          update-types:
              - 'minor'
              - 'patch'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: 'ci'
      include: scope
    groups:
      actions:
          patterns:
              - 'actions/*'
      setup:
          patterns:
              - 'shivammathur/setup-php'
      codecov:
          patterns:
              - 'codecov/*'
      release:
          patterns:
              - 'softprops/action-gh-release'
              - 'stefanzweifel/git-auto-commit-action'
